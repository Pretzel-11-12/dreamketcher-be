server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_DATASOURCE_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 50    # 45×(2−1)+1=46 → 약간의 버퍼(+4) 포함해서 50
      minimum-idle: 10         # 유휴 최소 커넥션: 풀을 완전히 채워둘 필요가 없으면 좀 낮춰도 OK
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 300000         # 5분(300초) 동안 놀고 있으면빼고 새로 생성
      max-lifetime: 1800000        # 30분마다 커넥션 교체 (DB 세션 재생성)

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  cookie:
    max-age: 604800000
    path: /
    same-site: Strict
    http-only: true
    secure: false

  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
    allowed-methods: ${ALLOWED_METHODS}

springdoc:
  swagger-ui:
    display-request-duration: true
  api-docs:
    path: /api-docs
    show-actuator: true

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    local-redirect-uri: ${GOOGLE_LOCAL_REDIRECT_URI}
    dev-redirect-uri: ${GOOGLE_DEV_REDIRECT_URI}
    local-uri: ${LOCAL_URI}
    grant-type: authorization_code
    scope: email

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-exp: 12345678
  refresh-exp: 12345678
  expiration: 12345678

management:
  endpoints:
    web:
      base-path: /api/v1
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework: info
    org.hibernate: info

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET_NAME}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    stack:
      auto: false

default:
  profile:
    image:
      url: ${DEFAULT_PROFILE_IMAGE_URL}